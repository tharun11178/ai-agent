services:
  # =========================================================================
  # 1. FRONTEND: Render Static Site (Loads Instantly from Global CDN - 0ms Cold Start)
  # =========================================================================
  - type: static
    name: ai-agent-challenge-ui
    buildCommand: npm run build:client
    publishDir: dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        value: https://ai-agent-challenge-api.onrender.com

  # =========================================================================
  # 2. BACKEND: Render Web Service (Express.js API Engine)
  # =========================================================================
  - type: web
    name: ai-agent-challenge-api
    env: node
    plan: free
    buildCommand: npm run build:server
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
